+++ index.html (修改后)
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SmartReport Analytics — منصة تحليل تقارير محلية تعمل بدون إنترنت: ربط ملفات Excel، تنظيف البيانات، داشبورد تفاعلي وملخص تنفيذي."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2E31'/%3E%3Cpath d='M8 22V14M14 22V8M20 22v-6M26 22V11' stroke='%23E8A020' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>SmartReport Analytics — تحليل التقارير الذكية</title>
    <style>
      html, body { height: 100%; margin: 0; background: #eef1f0; }
      #boot {
        position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #eef1f0;
        font-family: "IBM Plex Sans Arabic", "Alexandria", Tahoma, sans-serif; color: #12232a;
      }
      #boot .bar { width: 190px; height: 5px; border-radius: 99px; background: #dbe3e1; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 99px; background: #0e6e66; animation: bootmove 1.1s ease-in-out infinite; }
      @keyframes bootmove { 0% { transform: translateX(260%); } 100% { transform: translateX(-260%); } }
      #boot small { color: #64797f; font-size: 12px; }
      #boot .err { display: none; max-width: 440px; background: #fdf3dd; border: 1px solid #e8a020; color: #8a5c07; border-radius: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.9; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg width="46" height="46" viewBox="0 0 40 40">
          <rect width="40" height="40" rx="9" fill="#0E6E66" />
          <g stroke="#F5E9D0" stroke-width="3" stroke-linecap="round">
            <path d="M11 28v-8" /><path d="M18 28V10" stroke="#E8A020" /><path d="M25 28v-6" /><path d="M32 28V14" stroke="#E8A020" />
          </g>
          <circle cx="31" cy="9.5" r="2.4" fill="#E8A020" />
        </svg>
        <b style="font-size: 15px">SmartReport Analytics</b>
        <div class="bar"><i></i></div>
        <small id="boot-msg">جاري تشغيل النظام…</small>
        <div class="err" id="boot-err">
          تعذّر تشغيل النظام في هذا المتصفح.<br />
          جرّب تحديث الصفحة (F5) أو فتحها في نافذة تصفح خاصة، أو في متصفح حديث (Chrome / Edge).
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) {
          var m = document.getElementById("boot-msg");
          var e = document.getElementById("boot-err");
          if (m) m.style.display = "none";
          if (e) e.style.display = "block";
        }
      }, 12000);
      window.addEventListener("error", function () {
        var m = document.getElementById("boot-msg");
        var e = document.getElementById("boot-err");
        if (m) m.style.display = "none";
        if (e) e.style.display = "block";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
